name: CI
# Runs on every branch, master included. Checks attach to the commit, so a PR
# shows the result without a second pull_request-triggered run.
on: push

env:
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build and test (React ${{ matrix.react }})'
    # No container: the runner image already carries what Cypress needs -- xvfb, and
    # the shared libraries its Electron links against, via the preinstalled browsers.
    # cypress/browsers would also have to be re-pinned on every bump, and ships no make.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version the monolith runs. Full suite.
          - react: '18'
            version: '18.2.0'
            test: test-component
          # Compatibility leg. Skips audits, whose google-map-react calls the
          # ReactDOM.findDOMNode React 19 removed; see the Makefile target.
          - react: '19'
            version: '19.2.0'
            test: test-component-react19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: make install
      - run: make use-react-${{ matrix.version }}
      - run: make build
      - run: make ${{ matrix.test }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-react-${{ matrix.react }}
          path: cypress/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos-react-${{ matrix.react }}
          path: cypress/videos
          if-no-files-found: ignore
