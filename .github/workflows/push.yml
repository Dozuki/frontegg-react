name: CI
# Runs on every branch, master included. Checks attach to the commit, so a PR
# shows the result without a second pull_request-triggered run.
on: push

env:
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Install, Build and Test'
    runs-on: ubuntu-latest
    # Supplies the system libraries Cypress 5 needs; the Node it ships is overridden below.
    container: cypress/browsers:node12.13.0-chrome80-ff74
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: make install
      - run: make build
      - run: make test-component
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
